<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="images/favicon.png">
        <title>Emmy Zhang</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main class="container">
            <section class="section">
                <h2>Illustrations</h2>
                <div class="image-grid">
                    <div class="grid-item">
                        <img src="images/work/Cat_On_Crane_Final_2inch.png" alt="Description of animal illustration">
                    </div>
                    <div class="grid-item">
                        <img src="images/work/Cats In Hats 2.jpg" alt="Description of cat drawing">
                    </div>
                    <div class="grid-item">
                        <img src="images/work/Cherry Blossom Cat 2000.jpg" alt="Description of pet portrait sample">
                    </div>
                    <div class="grid-item">
                        <img src="images/work/I'm_Doing_Great_Edited_2000.jpg" alt="Another tall image filling a gap">
                    </div>
                    <div class="grid-item">
                        <img src="images/work/ItsAllUphillFromHere.jpg" alt="Another tall image filling a gap">
                    </div>
                    <div class="grid-item">
                        <img src="images/work/Legend of the White Snake 800.png" alt="Another tall image filling a gap">
                    </div>
                </div>
            </section>

            <section class="section">
                <h2>Pet Portraits</h2>
                <div class="image-grid">
                    <div class="grid-item">
                        <img src="images/work/Clementine_Clover_Sarie_Kord_Web.jpg" alt="Another tall image filling a gap">
                    </div>
                    <div class="grid-item">
                        <img src="images/work/Robot_&_Rachel_Web.jpg" alt="Another tall image filling a gap">
                    </div>
                </div>
            </section>
        </main>

        <!-- Modal lightbox structure -->
        <div id="image-modal" class="modal">
            <span class="modal-close">&times;</span>
            <img class="modal-content" id="modal-target-img" alt="">
        </div>

        <script src="modal.js"></script>
        <script src="nav.js"></script>
        <script src="footer.js"></script>
    </body>
</html>
